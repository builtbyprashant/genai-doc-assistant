# One command to run the whole system:  docker compose up --build
#   UI:   http://localhost:8501
#   API:  http://localhost:8000/docs
# Requires ANTHROPIC_API_KEY in your shell environment first (no .env file needed):
#   PowerShell:  $env:ANTHROPIC_API_KEY = "sk-ant-..."   (or set it via setx)
#   bash:        export ANTHROPIC_API_KEY=sk-ant-...

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      # Substituted from the host shell's environment (e.g. a Windows env var),
      # NOT a committed .env file. Compose errors with this message if it is unset.
      # Other settings use config.py defaults; add more lines here to override them.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in your shell/Windows env first}
      # Faster + cheaper model for lower latency (overrides config.py's sonnet default).
      # Comment this line out to fall back to the higher-quality claude-sonnet-4-6.
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    volumes:
      # Named volume keeps the ChromaDB index across restarts.
      # `docker compose down -v` deletes it — all documents must be re-uploaded.
      - chroma_data:/data/chroma
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      # Inside the Docker network, reach the API by service name, not localhost.
      # The frontend needs no API key — only the backend talks to Anthropic.
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy  # wait until /health returns 200
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  chroma_data:
