# One command to run the whole system:  docker compose up --build
#   UI:   http://localhost:8501
#   API:  http://localhost:8000/docs

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Named volume keeps the ChromaDB index across restarts.
      # `docker compose down -v` deletes it — all documents must be re-uploaded.
      - chroma_data:/data/chroma
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Inside the Docker network, reach the API by service name, not localhost.
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy  # wait until /health returns 200
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  chroma_data:
