name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mon & Thu — keep the pip + HuggingFace caches alive. GitHub evicts caches
    # not accessed for 7 days; on a low-activity repo a restore every few days
    # resets that clock. Public repo → Actions minutes are free.
    - cron: "0 6 * * 1,4"

jobs:
  # Did anything that affects the Docker images change? Used to gate the image
  # build so it only runs when it could actually break.
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so paths-filter diffs the push base (github.event.before)
          # locally instead of fetching it over the network, which flakes on push.
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'requirements.txt'
              - 'requirements-frontend.txt'
              - 'Dockerfile.backend'
              - 'Dockerfile.frontend'
              - '.dockerignore'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # python-magic needs the libmagic binary. On Linux/CI we use the real
      # python-magic (the Windows-only python-magic-bin swap is for local dev).
      - name: Install libmagic
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      # Cache the embedding + cross-encoder models so only the first run downloads them.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    needs: [test, changes]   # build only after tests pass
    # Build images only on a push to main that changed something affecting them
    # (requirements / Dockerfiles / .dockerignore). Everyday commits and PRs run
    # lint + test only. (P-3)
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.docker == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
