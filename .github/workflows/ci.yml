name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # python-magic needs the libmagic binary. On Linux/CI we use the real
      # python-magic (the Windows-only python-magic-bin swap is for local dev).
      - name: Install libmagic
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      # Cache the embedding + cross-encoder models so only the first run downloads them.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: pytest -q
